services:
  - type: web
    name: aivideo-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aivideo-postgres
          property: connectionString
      - key: STORAGE_MODE
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false

databases:
  - name: aivideo-postgres
    plan: free
    region: oregon
    databaseName: ai_video_platform
    user: postgres

